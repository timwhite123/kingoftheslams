<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King of the Slams</title>
<style>
  :root { --paper:#FAFBFC; --ink:#15171A; --ink2:#566070; --line:#D5DAE0; --gold:#FFC61A; --bp:#2A5A9C; }
  @media (prefers-color-scheme: dark) { :root { --paper:#111214; --ink:#F2F3F5; --ink2:#A4ACB6; --line:#33383F; --bp:#8DB2E8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  header img { width:44px; height:44px; border-radius:10px; }
  header a { color:var(--ink); text-decoration:none; font-weight:800; }
  h1 { font-size:34px; line-height:1.15; font-weight:900; letter-spacing:-0.5px; margin:0 0 6px; }
  h2 { font-size:20px; margin:32px 0 8px; }
  .kicker { font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing:1.2px; text-transform:uppercase; color:var(--bp); }
  .rule { height:7px; margin:14px 0 24px; background:
      linear-gradient(var(--line),var(--line)) bottom/100% 1px no-repeat,
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 6px) bottom/100% 3px no-repeat; }
  p, li { color:var(--ink); }
  .muted { color:var(--ink2); }
  a { color:var(--bp); }
  ul { padding-left: 20px; }
  footer { margin-top:40px; color:var(--ink2); font-size:14px; }
</style>
</head>
<body><main>
<header><img src="./icon.png" alt=""><a href="./">King of the Slams</a></header>
<div class="kicker">iPhone app</div>
<h1>Daily roasts for the jobsite</h1>
<div class="rule"></div>
<p>Five fresh slams every workday, picked for your trade. Comebacks for the classics. Clean, PG-13, or R. No account, no ads, and everything stays on your phone.</p>
<p><a href="privacy/">Privacy policy</a> · <a href="support/">Support</a></p>
<footer>King of the Slams · <a href="./privacy/">Privacy</a> · <a href="./support/">Support</a></footer>
</main></body></html>
